[tools]
lefthook = "2.1.0"
cocogitto = "6.5.0"
act = "0.2.84"
java = "temurin-25.0.4+7.0.LTS"

[tasks.clean]
run = "./gradlew clean"

[tasks.setup]
run = "./gradlew --quiet classes && lefthook install"

[tasks.format]
run = "./gradlew spotlessApply"

[tasks.lint]
run = "./gradlew spotlessCheck compileJava compileTestJava"

[tasks.test]
run = "./gradlew test"

# Continuous test loop: the inner loop during a live-coding session.
[tasks.tdd]
run = "./gradlew test --continuous --console=plain"

# Run one kata's tests, e.g. `mise run kata ledger`.
[tasks.kata]
run = "./gradlew test --tests '*katas.{{arg(name=\"name\")}}*' --console=plain"

[tasks.check]
depends = ["format", "lint", "test"]

# The full gate: warnings-as-errors, NullAway as errors, coverage floor.
[tasks.verify]
run = "./gradlew clean check -Pstrict"

[tasks.pre-commit]
depends = ["format", "lint"]

[tasks.build]
run = "./gradlew shadowJar"

[tasks.run]
run = "./gradlew --quiet --console=plain run"

[tasks.start]
depends = ["build"]
run = "java -jar bin/app.jar"

[tasks.act]
run = "act pull_request --secret-file .env -e .github/act/pull_request.json -j checks"
